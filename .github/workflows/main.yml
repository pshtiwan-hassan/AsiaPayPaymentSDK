name: Publish to NuGet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 🔹 Setup .NET SDK for .NET 8
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0
          source-url: https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}

      # 🔹 Debug Repository Structure
      - name: Debug Repository Structure
        run: ls -lah

      # 🔹 Ensure README.md is included in the package
      - name: Copy README.md
        run: cp README.md AsiaPayPaymentSDK/README.md || echo "README.md already exists"

      # 🔹 Verify README.md Exists
      - name: Verify README.md Exists
        run: cat AsiaPayPaymentSDK/README.md || echo "README.md NOT FOUND!"

      # 🔹 Restore Dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # 🔹 Build the Project
      - name: Build the Project
        run: dotnet build --configuration Release --no-restore

      # 🔹 Create NuGet Package
      - name: Create NuGet Package
        run: dotnet pack --configuration Release --no-build --output nupkgs

      # 🔹 Publish to NuGet
      - name: Publish to NuGet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
